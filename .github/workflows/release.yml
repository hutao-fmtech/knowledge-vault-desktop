name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach installers to (e.g. v0.1.0). Leave empty to only build artifacts."
        required: false

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The app version (installer names + in-app version) lives in apps/desktop.
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/desktop/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME matches apps/desktop/package.json $PKG_VERSION"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke

  build:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifacts: |
              apps/desktop/dist/*.exe
          - os: macos-latest
            target: --mac
            artifacts: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*-mac.zip
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned internal-test builds (M1); signing/notarization tracked separately.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke
      - run: node scripts/build-desktop.mjs ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la out
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Knowledge Vault $TAG" --notes-file .github/release-notes.md --prerelease
          fi
          gh release upload "$TAG" out/* --clobber
