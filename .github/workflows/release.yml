name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release. false = package-only (build + launch-smoke installers as artifacts; no tag, no release)."
        type: boolean
        default: false
      tag:
        description: "Existing tag to attach installers to (e.g. v0.2.2). Only used when publish=true."
        required: false

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Release notes mention the tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Guard against publishing stale notes (v0.2.3 initially shipped v0.2.2's).
          grep -qF "$GITHUB_REF_NAME" .github/release-notes.md || {
            echo "::error::.github/release-notes.md does not mention $GITHUB_REF_NAME; update it before tagging"; exit 1; }
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The app version (installer names + in-app version) lives in apps/desktop.
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/desktop/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME matches apps/desktop/package.json $PKG_VERSION"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build (tsc -b) — the installers package this compiled output
        run: pnpm run build
      - run: pnpm run smoke

  build:
    # Plain job name: multi-line matrix values in the default name break `gh run view --log`.
    name: build-${{ matrix.os }}
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifacts: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*-portable.zip
          - os: macos-latest
            target: --mac
            artifacts: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*-mac.zip
          - os: ubuntu-latest
            target: --linux
            artifacts: |
              apps/desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned internal-test builds (M1); signing/notarization tracked separately.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile
      - name: build (tsc -b)
        run: pnpm run build
      # Full Node smoke on every OS, including Windows (issue #18 fixed: Git Bash).
      - name: smoke against the compiled output
        env:
          KVD_REQUIRE_DSH_E2E: "1"
        run: pnpm run smoke
      - name: installers (build-desktop runs tsc -b, stages lib/ via pnpm deploy, electron-builder)
        run: node scripts/build-desktop.mjs ${{ matrix.target }} --publish never
      - name: Windows portable zip (name from apps/desktop/package.json version)
        if: runner.os == 'Windows'
        run: node scripts/zip-win-portable.js
      - name: launch smoke (packaged app headless; version == apps/desktop/package.json; plugins 28/28)
        run: node scripts/launch-smoke.mjs
      - name: launch smoke mac x64 (Rosetta)
        if: runner.os == 'macOS'
        run: |
          if /usr/bin/pgrep -q oahd || arch -x86_64 /usr/bin/true 2>/dev/null; then
            node scripts/launch-smoke.mjs --arch x64
          else
            echo "::warning::Rosetta unavailable on this runner; x64 mac build packaged but not launched"
          fi
      - name: installer names carry the app version
        run: |
          V=$(node -p "require('./apps/desktop/package.json').version")
          ls -la apps/desktop/dist
          N=$(ls apps/desktop/dist | grep -E '\.(exe|dmg|zip|AppImage)$' | grep -c -- "$V" || true)
          T=$(ls apps/desktop/dist | grep -cE '\.(exe|dmg|zip|AppImage)$' || true)
          echo "installers with version $V: $N/$T"
          [ "$T" -gt 0 ] && [ "$N" -eq "$T" ]
      # Prefer direct release upload: Actions artifact storage can hit quota even when
      # GitHub Release storage is fine (quota recalc is 6-12h after deletes).
      - name: Upload installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Knowledge Vault $TAG" --notes-file .github/release-notes.md --prerelease
          fi
          case "${{ matrix.os }}" in
            windows-latest) files=(apps/desktop/dist/*.exe apps/desktop/dist/*-portable.zip) ;;
            macos-latest) files=(apps/desktop/dist/*.dmg apps/desktop/dist/*-mac.zip) ;;
            ubuntu-latest) files=(apps/desktop/dist/*.AppImage) ;;
            *) echo "::error::unknown matrix.os ${{ matrix.os }}"; exit 1 ;;
          esac
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installer files found for ${{ matrix.os }}"
            ls -la apps/desktop/dist || true
            exit 1
          fi
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn

  release:
    needs: build
    # Package-only dispatches (publish=false, the default) stop after build: no tag, no release.
    # Assets are attached by each build job; this job only ensures the release exists.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Knowledge Vault $TAG" --notes-file .github/release-notes.md --prerelease
          fi
          gh release view "$TAG"
