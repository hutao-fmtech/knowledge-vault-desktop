name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: build + typecheck + any-gate + boundaries + unit tests
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RS-9 tsc -b (strict, project references) — must be 0 errors
        run: |
          set -o pipefail
          pnpm exec tsc -b --pretty false 2>&1 | tee tsc.txt
          N=$(grep -c 'error TS' tsc.txt || true)
          echo "TSC_ERRORS=$N"
          [ "$N" -eq 0 ]
      - name: RS-9 typecheck tests (tsconfig.test.json)
        run: pnpm exec tsc -p tsconfig.test.json --pretty false
      - name: RS-9 every any / ts-ignore / ts-expect-error carries an inline `// any:` reason
        run: node scripts/check-any.mjs
      - name: renderer assets next to the compiled renderer
        run: node scripts/copy-renderer-assets.mjs
      - name: check-boundaries (.ts + type-only imports; undeclared deps / cross-package relative imports / cycles fail)
        run: pnpm run check-boundaries
      - name: check-boundaries + check-any self-tests
        run: node --test scripts/test/*.test.mjs
      - name: unit tests (vitest, every workspace package)
        run: pnpm -r test

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      # Pure Node smoke; skip Electron binary download for this job.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Node 22 runner: the advanced Part B/C e2e must not be skipped.
      KVD_REQUIRE_DSH_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build (tsc -b) — smokes run against the compiled lib/ output
        run: pnpm run build
      - run: pnpm run smoke | tee smoke.txt
      - name: RS-7 smoke counts only increase
        run: |
          set -euo pipefail
          A=$(grep -oP 'AGENT_SMOKE_OK \K[0-9]+(?= asserts)' smoke.txt)
          B=$(grep -oP 'ADVANCED_SMOKE_OK \K[0-9]+(?= checks)' smoke.txt)
          echo "AGENT_SMOKE_OK=$A ADVANCED_SMOKE_OK=$B"
          [ "$A" -ge 284 ] && [ "$B" -ge 119 ]

  smoke-windows:
    # Issue #18: the advanced bash sandbox must really execute on Windows
    # (Git Bash under the restricted-token runner), not resolve the WSL launcher.
    name: smoke (windows, real dsh sandbox)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      KVD_REQUIRE_DSH_E2E: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run smoke 2>&1 | tee smoke.txt
      - name: advanced checks ran for real via pwsh (approval, read-only, escalation, disable)
        run: |
          set -euo pipefail
          for c in \
            'advanced shell tool on win32: pwsh' \
            '✓ cordis.yml mounts exactly the pwsh shell tool on win32' \
            '✓ system prompt names the PowerShell shell tool' \
            '✓ real call intercepted BEFORE execution with full command + all arguments (AC-13)' \
            '✓ approval dialog labels the command as PowerShell' \
            '✓ Deny prevents execution (file not created)' \
            '✓ approved command still cannot write: sandbox is read-only' \
            '✓ read-only check is not vacuous: confined pwsh actually ran (read + listing output present)' \
            '✓ sandbox pwsh is a working shell' \
            '✓ AC3: approved call executed; its result is in the run summary' \
            '✓ AC1 [approve]: escalation requests never show an approval modal' \
            '✓ AC1 [log-only]: escalation rejected, nothing written' \
            '✓ disable stops/unmounts the advanced fiber immediately (AC-12)' \
            '✓ after disable, advanced runs are refused (default behaviour restored)' \
            '(sandbox output:'; do
            grep -F -- "$c" smoke.txt || { echo "MISSING: $c"; exit 1; }
          done
          A=$(grep -oP 'AGENT_SMOKE_OK \K[0-9]+(?= asserts)' smoke.txt)
          B=$(grep -oP 'ADVANCED_SMOKE_OK \K[0-9]+(?= checks)' smoke.txt)
          echo "AGENT_SMOKE_OK=$A ADVANCED_SMOKE_OK=$B"
          [ "$A" -ge 284 ] && [ "$B" -ge 119 ]

  pack-smoke:
    name: pack-smoke (asar + Electron Node + cordis.yml composition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile
      - name: tsc -b + electron-builder --dir (staged via pnpm deploy; packs lib/)
        run: node scripts/build-desktop.mjs --dir --linux
      - name: launch packaged app (xvfb) and assert every cordis.yml plugin mounted
        run: |
          set -euo pipefail
          APP_DIR="apps/desktop/dist/linux-unpacked"
          if [ ! -d "$APP_DIR" ]; then
            echo "missing $APP_DIR" >&2
            ls -la apps/desktop/dist || true
            exit 1
          fi
          if [ -x "$APP_DIR/knowledge-vault-desktop" ]; then
            BIN="$APP_DIR/knowledge-vault-desktop"
          else
            BIN="$(find "$APP_DIR" -maxdepth 1 -type f -executable ! -name '*.so' ! -name 'chrome_crashpad_handler' ! -name 'chrome-sandbox' | head -1)"
          fi
          echo "launching $BIN"
          OUT="$(mktemp)"
          set +e
          xvfb-run -a "$BIN" --no-sandbox --kvd-pack-smoke >"$OUT" 2>&1
          CODE=$?
          set -e
          cat "$OUT"
          if [ "$CODE" -ne 0 ]; then
            echo "packaged app exited $CODE" >&2
            exit "$CODE"
          fi
          node scripts/assert-pack-smoke.mjs "$OUT"
